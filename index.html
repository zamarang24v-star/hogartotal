<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HogarTotal</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
        <h1 class="text-2xl font-bold text-center text-orange-400">HogarTotal 🏠</h1>
        
        <!-- Estado de conexión -->
        <div id="estado-conexion" class="text-xs text-center py-1 px-2 rounded bg-slate-700 text-slate-300">
            Conectando con Firebase...
        </div>

        <!-- Apartado de la Compra / Notas Compartidas -->
        <div class="space-y-3">
            <h2 class="text-lg font-semibold text-slate-200">Lista Compartida</h2>
            <div class="flex gap-2">
                <input type="text" id="nuevo-item" placeholder="Añadir algo (ej. Leche)..." 
                    class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-orange-500">
                <button onclick="agregarItem()" 
                    class="bg-orange-500 hover:bg-orange-600 font-bold px-4 py-2 rounded-lg transition-colors">
                    Añadir
                </button>
            </div>
            
            <!-- Lista donde se pintarán los datos en tiempo real -->
            <ul id="lista-elementos" class="space-y-2 max-h-60 overflow-y-auto">
                <li class="text-slate-400 text-center py-4">Cargando datos...</li>
            </ul>
        </div>
    </div>

    <!-- Script de Firebase y lógica de sincronización -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // =========================================================================
        // TUS CLAVES REALES DE FIREBASE (Copiadas del panel que acabamos de hacer)
        // =========================================================================
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_DOMINIO.firebaseapp.com",
            databaseURL: "TU_DATABASE_URL",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Referencia al estado de conexión visual
        const estadoDiv = document.getElementById("estado-conexion");
        estadoDiv.textContent = "🟢 Conectado en tiempo real";
        estadoDiv.className = "text-xs text-center py-1 px-2 rounded bg-green-900/50 text-green-300";

        // Referencia a la base de datos (nodo 'hogartotal/lista')
        const listaRef = ref(db, 'hogartotal/lista');

        // Función para añadir elemento
        window.agregarItem = function() {
            const input = document.getElementById("nuevo-item");
            const valor = input.value.trim();
            if (valor === "") return;

            // Guardar en Firebase
            const nuevoItemRef = push(listaRef);
            set(nuevoItemRef, { texto: valor });
            input.value = "";
        };

        // Función para borrar elemento
        window.borrarItem = function(id) {
            remove(ref(db, 'hogartotal/lista/' + id));
        };

        // Escuchar cambios en tiempo real (se actualiza solo en tu móvil y el de tu pareja)
        onValue(listaRef, (snapshot) => {
            const ul = document.getElementById("lista-elementos");
            ul.innerHTML = "";
            
            const data = snapshot.val();
            if (!data) {
                ul.innerHTML = '<li class="text-slate-400 text-center py-4">No hay elementos todavía</li>';
                return;
            }

            Object.keys(data).forEach((key) => {
                const item = data[key];
                const li = document.createElement("li");
                li.className = "flex justify-between items-center bg-slate-700/50 px-4 py-2 rounded-lg border border-slate-700";
                li.innerHTML = `
                    <span class="text-slate-100">${item.texto}</span>
                    <button onclick="borrarItem('${key}')" class="text-red-400 hover:text-red-300 text-sm font-semibold px-2 py-1">✕</button>
                `;
                ul.appendChild(li);
            });
        });
    </script>
</body>
</html>
