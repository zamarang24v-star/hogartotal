<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HogarTotal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 pb-20">
  <div class="max-w-md mx-auto space-y-4">
    <header class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
      <h1 class="font-bold text-lg text-emerald-400">HogarTotal 🏠</h1>
      <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded-full">Local OK</span>
    </header>

    <!-- Navegación de Pestañas -->
    <div class="grid grid-cols-2 gap-2">
      <button onclick="cambiarTab('compra')" id="btn-tab-compra" class="p-3 bg-slate-800 rounded-xl font-semibold text-sm border border-emerald-500">🛒 Compra</button>
      <button onclick="cambiarTab('agenda')" id="btn-tab-agenda" class="p-3 bg-slate-900 rounded-xl font-semibold text-sm border border-slate-800">📅 Agenda</button>
    </div>

    <!-- MÓDULO COMPRA -->
    <div id="tab-compra" class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
      <h2 class="font-bold text-base">Lista de la Compra</h2>
      <div class="flex gap-2">
        <input type="text" id="inp-compra" placeholder="Añadir producto..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        <button onclick="addCompra()" class="bg-emerald-600 px-4 py-2 rounded-xl text-sm font-semibold active:scale-95">Añadir</button>
      </div>
      <ul id="ul-compra" class="space-y-2 text-sm pt-2"></ul>
    </div>

    <!-- MÓDULO AGENDA -->
    <div id="tab-agenda" class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3 hidden">
      <h2 class="font-bold text-base">Agenda Compartida</h2>
      <input type="text" id="inp-evento" placeholder="Título del evento..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
      <input type="date" id="inp-fecha" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-300">
      <button onclick="addAgenda()" class="w-full bg-amber-600 py-2 rounded-xl text-sm font-semibold active:scale-95">Guardar Evento</button>
      <ul id="ul-agenda" class="space-y-2 text-sm pt-2"></ul>
    </div>
  </div>

  <script>
    // Al cargar la página leemos lo que hay guardado
    document.addEventListener("DOMContentLoaded", () => {
      cargarCompra();
      cargarAgenda();
    });

    function cambiarTab(tab) {
      if(tab === 'compra') {
        document.getElementById('tab-compra').classList.remove('hidden');
        document.getElementById('tab-agenda').classList.add('hidden');
        document.getElementById('btn-tab-compra').className = "p-3 bg-slate-800 rounded-xl font-semibold text-sm border border-emerald-500";
        document.getElementById('btn-tab-agenda').className = "p-3 bg-slate-900 rounded-xl font-semibold text-sm border border-slate-800";
      } else {
        document.getElementById('tab-agenda').classList.remove('hidden');
        document.getElementById('tab-compra').classList.add('hidden');
        document.getElementById('btn-tab-agenda').className = "p-3 bg-slate-800 rounded-xl font-semibold text-sm border border-amber-500";
        document.getElementById('btn-tab-compra').className = "p-3 bg-slate-900 rounded-xl font-semibold text-sm border border-slate-800";
      }
    }

    // --- COMPRA ---
    function cargarCompra() {
      const lista = JSON.parse(localStorage.getItem('ht_compra') || '[]');
      const ul = document.getElementById('ul-compra');
      ul.innerHTML = '';
      lista.forEach((item, index) => {
        ul.innerHTML += `<li class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800">
          <span>${item}</span>
          <button onclick="delCompra(${index})" class="text-rose-400 text-xs">Borrar</button>
        </li>`;
      });
    }

    function addCompra() {
      const inp = document.getElementById('inp-compra');
      if(!inp.value.trim()) return;
      const lista = JSON.parse(localStorage.getItem('ht_compra') || '[]');
      lista.push(inp.value.trim());
      localStorage.setItem('ht_compra', JSON.stringify(lista));
      inp.value = '';
      cargarCompra();
    }

    function delCompra(index) {
      const lista = JSON.parse(localStorage.getItem('ht_compra') || '[]');
      lista.splice(index, 1);
      localStorage.setItem('ht_compra', JSON.stringify(lista));
      cargarCompra();
    }

    // --- AGENDA ---
    function cargarAgenda() {
      const lista = JSON.parse(localStorage.getItem('ht_agenda') || '[]');
      const ul = document.getElementById('ul-agenda');
      ul.innerHTML = '';
      lista.forEach((item, index) => {
        ul.innerHTML += `<li class="flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800">
          <div><p class="font-semibold">${item.titulo}</p><p class="text-xs text-amber-400">${item.fecha}</p></div>
          <button onclick="delAgenda(${index})" class="text-rose-400 text-xs">Borrar</button>
        </li>`;
      });
    }

    function addAgenda() {
      const t = document.getElementById('inp-evento');
      const f = document.getElementById('inp-fecha');
      if(!t.value.trim() || !f.value) return;
      const lista = JSON.parse(localStorage.getItem('ht_agenda') || '[]');
      lista.push({ titulo: t.value.trim(), fecha: f.value });
      localStorage.setItem('ht_agenda', JSON.stringify(lista));
      t.value = ''; f.value = '';
      cargarAgenda();
    }

    function delAgenda(index) {
      const lista = JSON.parse(localStorage.getItem('ht_agenda') || '[]');
      lista.splice(index, 1);
      localStorage.setItem('ht_agenda', JSON.stringify(lista));
      cargarAgenda();
    }
  </script>
</body>
</html>
